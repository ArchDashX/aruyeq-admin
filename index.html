<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin | ARUYEQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-base: #faf9f6; --text-main: #1a1a1a; --text-muted: #555555; --navy: #2b2b8a; --navy-light: #3a3aa0; --red: #c8102e; --white: #ffffff; --surface: #ffffff; --border-color: #eaeaea; --shadow-sm: 0 2px 8px rgba(0,0,0,0.04); --shadow-lg: 0 12px 32px rgba(0,0,0,0.08); --radius: 12px; --font-main: 'Inter', system-ui, -apple-system, sans-serif; --transition: all 0.2s ease; }

        .card { width: 100%; max-width: 800px; background: var(--surface); padding: 2.5rem 2rem; border-radius: var(--radius); box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); position: relative; }
        
        #login-view { display: block; max-width: 400px; margin: 0 auto; }
        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-header h1 { color: var(--navy); font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; }
        .login-header p { color: var(--text-muted); font-size: 0.9rem; }
        .input-group { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
        .input-group input { padding: 1rem; border: 1px solid var(--border-color); border-radius: 8px; font-family: var(--font-main); font-size: 0.95rem; outline: none; transition: var(--transition); }
        .input-group input:focus { border-color: var(--navy); }
        .btn { width: 100%; padding: 1rem; background: var(--navy); color: var(--white); border: none; border-radius: 8px; font-family: var(--font-main); font-weight: 600; font-size: 1rem; cursor: pointer; transition: var(--transition); }
        .btn:hover { background: var(--navy-light); }
        .error { color: var(--red); font-size: 0.85rem; margin-top: 0.5rem; display: none; text-align: center; }

        #dashboard-view { display: none; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1.5rem; }
        .dashboard-header h2 { color: var(--navy); font-size: 1.5rem; }
        .logout-btn { background: var(--red); color: var(--white); border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: var(--transition); }
        .logout-btn:hover { background: #a00d25; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: #fcfcfc; border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 8px; text-align: center; }
        .stat-card h3 { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
        .stat-card p { font-size: 1.8rem; font-weight: 800; color: var(--navy); }

        .table-wrapper { overflow-x: auto; border: 1px solid var(--border-color); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #fcfcfc; padding: 1rem; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        td { padding: 1rem; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-main); }
        tr:last-child td { border-bottom: none; }
        
        .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge-all { background: #e0e4ff; color: var(--navy); }
        .badge-necessary { background: #ffe0e4; color: var(--red); }
        .badge-none { background: #eee; color: var(--text-muted); }
        .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }

        @media (max-width: 480px) { .card { padding: 1.5rem; } .dashboard-header { flex-direction: column; gap: 1rem; align-items: flex-start; } }
    </style>
</head>
<body>

    <div class="card">
        <div id="login-view">
            <div class="login-header"><h1>ADMIN</h1><p>System Authorization</p></div>
            <div class="input-group">
                <input type="text" id="username" placeholder="Identifier" autocomplete="off">
                <input type="password" id="password" placeholder="Access Key" autocomplete="off">
            </div>
            <button class="btn" id="login-btn">Verify</button>
            <div class="error" id="error-msg">Access denied. Invalid credentials.</div>
        </div>

        <div id="dashboard-view">
            <div class="dashboard-header">
                <h2>Cookie Consent Logs</h2>

            </div>
            <div class="stats-grid">
                <div class="stat-card"><h3>Total Visits</h3><p id="stat-total">0</p></div>
                <div class="stat-card"><h3>Accepted All</h3><p id="stat-all">0</p></div>
                <div class="stat-card"><h3>Only Necessary</h3><p id="stat-necessary">0</p></div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Timestamp</th><th>Session ID</th><th>Choice</th></tr></thead>
                    <tbody id="logs-table-body"></tbody>
                </table>
                <div class="empty-state" id="empty-state" style="display: none;">No consent data recorded yet.</div>
            </div>
        </div>
    </div>
