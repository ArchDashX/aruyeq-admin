<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Notes | ARUYEQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-base: #faf9f6; --text-main: #1a1a1a; --text-muted: #555555; --navy: #2b2b8a; --navy-light: #3a3aa0; --red: #c8102e; --white: #ffffff; --surface: #ffffff; --border-color: #eaeaea; --shadow-lg: 0 12px 32px rgba(0,0,0,0.08); --radius: 12px; --font-main: 'Inter', system-ui, -apple-system, sans-serif; --transition: all 0.2s ease; }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-main); background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 2rem 1rem; line-height: 1.5; -webkit-font-smoothing: antialiased; }
        
        .card { width: 100%; max-width: 600px; background: var(--surface); padding: 2.5rem 2rem; border-radius: var(--radius); box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); }
        
        #login-view { display: block; max-width: 400px; margin: 0 auto; }
        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-header h1 { color: var(--navy); font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; }
        .input-group { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
        .input-group input { padding: 1rem; border: 1px solid var(--border-color); border-radius: 8px; font-family: var(--font-main); font-size: 0.95rem; outline: none; }
        .input-group input:focus { border-color: var(--navy); }
        .btn { width: 100%; padding: 1rem; background: var(--navy); color: var(--white); border: none; border-radius: 8px; font-family: var(--font-main); font-weight: 600; cursor: pointer; transition: var(--transition); }
        .btn:hover { background: var(--navy-light); }
        .error { color: var(--red); font-size: 0.85rem; margin-top: 0.5rem; display: none; text-align: center; }

        #dashboard-view { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1.5rem; }
        .header h2 { color: var(--navy); font-size: 1.2rem; }
        .logout-btn { background: var(--red); color: var(--white); border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        
        textarea {
            width: 100%; height: 300px; padding: 1rem; border: 1px solid var(--border-color);
            border-radius: 8px; font-family: monospace; font-size: 0.95rem; line-height: 1.6;
            resize: vertical; outline: none; background: #fcfcfc;
        }
        textarea:focus { border-color: var(--navy); background: #fff; }
        
        .status { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem; text-align: right; height: 1rem; }
    </style>
</head>
<body>

    <div class="card">
        <!-- LOGIN -->
        <div id="login-view">
            <div class="login-header"><h1>ADMIN</h1></div>
            <div class="input-group">
                <input type="text" id="username" placeholder="Login" autocomplete="off">
                <input type="password" id="password" placeholder="Hasło" autocomplete="off">
            </div>
            <button class="btn" id="login-btn">Zaloguj</button>
            <div class="error" id="error-msg">Błędne dane logowania.</div>
        </div>

        <!-- NOTES -->
        <div id="dashboard-view">
            <div class="header">
                <h2>Prywatne Notatki</h2>
                <button class="logout-btn" id="logout-btn">Wyloguj</button>
            </div>
            <textarea id="notes" placeholder="Wpisz swoje notatki tutaj... Zapisuje się automatycznie."></textarea>
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        const NOTES_KEY = 'aruyeq_admin_notes';
        const AUTH_KEY = 'aruyeq_admin_session';

        // Autoryzacja (prosta, po stronie klienta)
        document.getElementById('login-btn').addEventListener('click', () => {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === 'admin' && p === 'admin') {
                sessionStorage.setItem(AUTH_KEY, 'true');
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('dashboard-view').style.display = 'block';
                loadNotes();
            } else {
                const err = document.getElementById('error-msg');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 3000);
            }
        });

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('login-btn').click();
        });

        // Wylogowanie
        document.getElementById('logout-btn').addEventListener('click', () => {
            sessionStorage.removeItem(AUTH_KEY);
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('login-view').style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        });

        // Notatnik (autosave)
        function loadNotes() {
            const notes = localStorage.getItem(NOTES_KEY) || '';
            document.getElementById('notes').value = notes;
        }

        let saveTimeout;
        document.getElementById('notes').addEventListener('input', (e) => {
            const status = document.getElementById('status');
            status.textContent = 'Zapisywanie...';
            
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem(NOTES_KEY, e.target.value);
                status.textContent = 'Zapisano.';
                setTimeout(() => { status.textContent = ''; }, 2000);
            }, 500); // Debounce 500ms
        });

        // Sprawdź sesję przy starcie
        if (sessionStorage.getItem(AUTH_KEY) === 'true') {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
            loadNotes();
        }
    </script>
</body>
</html>
