<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Notes | ARUYEQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-base: #faf9f6; 
            --text-main: #1a1a1a; 
            --text-muted: #555555; 
            --navy: #2b2b8a; 
            --border-color: #eaeaea; 
            --surface: #ffffff; 
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.08); 
            --radius: 12px; 
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: var(--font-main); 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 2rem 1rem; 
            line-height: 1.5; 
            -webkit-font-smoothing: antialiased; 
        }
        
        .card { 
            width: 100%; 
            max-width: 700px; 
            background: var(--surface); 
            padding: 2.5rem 2rem; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow-lg); 
            border: 1px solid var(--border-color); 
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 1rem; 
            margin-bottom: 1.5rem; 
        }
        
        .header h1 { 
            color: var(--navy); 
            font-size: 1.2rem; 
            font-weight: 800;
            letter-spacing: 1px;
        }
        
        .status { 
            font-size: 0.75rem; 
            color: var(--text-muted); 
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .status.show { opacity: 1; }
        
        textarea {
            flex: 1;
            width: 100%; 
            padding: 1rem; 
            border: 1px solid var(--border-color);
            border-radius: 8px; 
            font-family: monospace; 
            font-size: 0.95rem; 
            line-height: 1.6;
            resize: none; 
            outline: none; 
            background: #fcfcfc;
            color: var(--text-main);
        }
        
        textarea:focus { 
            border-color: var(--navy); 
            background: #fff; 
        }

        @media (max-width: 480px) { 
            .card { padding: 1.5rem; height: 90vh; } 
        }
    </style>
</head>
<body>

    <main class="card">
        <div class="header">
            <h1>NOTES</h1>
            <span class="status" id="status">Zapisano</span>
        </div>
        <textarea id="notes" placeholder="Wpisz swoje notatki tutaj..."></textarea>
    </main>

    <script>
        const NOTES_KEY = 'aruyeq_notes';
        const notesEl = document.getElementById('notes');
        const statusEl = document.getElementById('status');
        let saveTimeout;

        // Ładowanie przy starcie
        notesEl.value = localStorage.getItem(NOTES_KEY) || '';

        // Autosave z debounce
        notesEl.addEventListener('input', (e) => {
            statusEl.textContent = 'Zapisywanie...';
            statusEl.classList.add('show');
            
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem(NOTES_KEY, e.target.value);
                statusEl.textContent = 'Zapisano';
                
                setTimeout(() => { statusEl.classList.remove('show'); }, 1500);
            }, 500);
        });
    </script>
</body>
</html>
